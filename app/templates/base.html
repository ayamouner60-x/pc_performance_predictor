<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}FPS Predictor{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="icon" type="image/png" href="https://img.icons8.com/nolan/512/gaming.png" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mainBg: "#1e1e1e",
            secBg: "#282828",
            cardBg: "#2a2a2a",
            accentBlue: "#00a8ff",
            darkBlue: "#007bb5",
            inputBg: "#1e1e1e",
            textMuted: "#8a8a8a",
          },
          fontFamily: {
            sans: ["Montserrat", "sans-serif"],
          },
        },
      },
    };
  </script>

  {% block extra_css %}{% endblock %}
</head>

<body class="bg-mainBg text-white font-sans antialiased overflow-x-hidden relative">
  <div class="floating-bg">
    <img src="https://img.icons8.com/nolan/512/steam--v2.png" class="float-icon icon-1" alt="Steam" />
    <img src="https://img.icons8.com/nolan/512/settings--v1.png" class="float-icon icon-2" alt="Settings" />
    <img src="https://img.icons8.com/nolan/512/epic-games.png" class="float-icon icon-3" alt="Epic" />
    <img src="https://img.icons8.com/nolan/512/valorant.png" class="float-icon icon-4" alt="Valorant" />
    <img src="https://img.icons8.com/nolan/512/counter-strike.png" class="float-icon icon-5" alt="CS" />
    <img src="https://img.icons8.com/nolan/512/discord-logo.png" class="float-icon icon-6" alt="Discord" />
    <img src="https://img.icons8.com/nolan/512/nvidia.png" class="float-icon icon-7" alt="Nvidia" />
  </div>

  <header class="relative z-10 flex justify-between items-center py-8 px-6 md:px-16" data-aos="fade-down"
    data-aos-duration="1000">
    <div class="text-2xl font-black tracking-widest">
      FPS<span class="text-accentBlue">PREDICTOR</span>
    </div>
    <nav class="hidden md:flex space-x-10 text-sm font-bold text-textMuted uppercase">
      <a href="{{ url_for('main.index') }}"
        class="relative pb-1 after:content-[''] after:absolute after:left-0 after:-bottom-1 after:h-[2px] after:bg-accentBlue after:transition-all after:duration-300 transition duration-300
        {% if request.endpoint == 'main.index' %}text-accentBlue after:w-full{% else %}hover:text-accentBlue after:w-0 hover:after:w-full{% endif %}">Home</a>
      <a href="{{ url_for('main.dashBoard') }}"
        class="relative pb-1 after:content-[''] after:absolute after:left-0 after:-bottom-1 after:h-[2px] after:bg-accentBlue after:transition-all after:duration-300 transition duration-300
        {% if request.endpoint == 'main.dashBoard' %}text-accentBlue after:w-full{% else %}hover:text-accentBlue after:w-0 hover:after:w-full{% endif %}">DashBoard</a>
    </nav>
  </header>

  {% block content %}{% endblock %}

  <footer class="relative z-10 text-center py-8 text-textMuted text-xs bg-[#111] mt-12 tracking-widest uppercase">
    COPYRIGHT &copy; 2026 FPS Predictor INC. ALL RIGHTS RESERVED.
  </footer>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>

</html>
